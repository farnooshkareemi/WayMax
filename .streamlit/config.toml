[server]
# Disabled: Streamlit's file watcher imports every installed package (including
# torch-dependent ones like transformers) to build its hot-reload path list.
# On this machine, torch's c10.dll fails to load outside the ctypes preload
# hotfix in src/ui/app.py, so the watcher's own imports crash with
# "OSError: [WinError 1114]" noise in the terminal on every file change poll.
# This doesn't break the app - Streamlit just logs the failure and moves on -
# but it's spammy. Disabling means edits to src/ui/app.py won't auto-reload;
# press 'r' in the browser tab or restart `streamlit run` to pick up changes.
fileWatcherType = "none"

# Defining both [theme.light] and [theme.dark] makes Streamlit show its own
# light/dark toggle in the app's settings menu (top-right "⋮" icon) - no
# custom CSS or session_state toggle code needed. Replaces the old hand-rolled
# stock-photo background with a clean, deliberate palette in both modes.
#
# baseRadius/buttonRadius use Streamlit's native theming (not custom CSS) to
# get soft, rounded corners on cards/inputs/buttons - a warmer coral/teal
# travel-brand palette instead of the earlier plain blue.
[theme.light]
primaryColor = "#FF6B5B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF5F2"
textColor = "#1F2937"
borderColor = "#F3D9D3"
baseRadius = "1rem"
buttonRadius = "full"
showWidgetBorder = true

[theme.dark]
primaryColor = "#FF8A75"
backgroundColor = "#14100F"
secondaryBackgroundColor = "#1F1917"
textColor = "#F5EDEA"
borderColor = "#3A2C27"
baseRadius = "1rem"
buttonRadius = "full"
showWidgetBorder = true
