[server]
# Disabled: Streamlit's file watcher imports every installed package (including
# torch-dependent ones like transformers) to build its hot-reload path list.
# On this machine, torch's c10.dll fails to load outside the ctypes preload
# hotfix in src/ui/app.py, so the watcher's own imports crash with
# "OSError: [WinError 1114]" noise in the terminal on every file change poll.
# This doesn't break the app - Streamlit just logs the failure and moves on -
# but it's spammy. Disabling means edits to src/ui/app.py won't auto-reload;
# press 'r' in the browser tab or restart `streamlit run` to pick up changes.
fileWatcherType = "none"

# Defining both [theme.light] and [theme.dark] makes Streamlit show its own
# light/dark toggle in the app's settings menu (top-right "⋮" icon) - no
# custom CSS or session_state toggle code needed.
#
# Palette adapted from the Waymax design mock (Waymax.dc.html): a blush-pink
# ground, deep-plum ink, rose-pink primary accent, and a navy secondary used
# for section labels/route markers. baseRadius/buttonRadius give the same
# pill-shaped buttons and rounded cards as the mock, natively (no custom CSS).
# The dark palette isn't in the mock (it's light-only) - derived by keeping
# the same accent/ink relationships against a dark plum ground instead.
# Nunito (body) + Quicksand (headings) match the mock's pairing. Streamlit's
# font/headingFont accept a "<name>:<url>" Google Fonts CSS URL natively, so
# this needs no custom CSS or unsafe_allow_html injection either.
[theme.light]
primaryColor = "#E8748F"
backgroundColor = "#FDEEF1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C2438"
borderColor = "#E3D5DC"
baseRadius = "1.25rem"
buttonRadius = "full"
showWidgetBorder = true
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFont = "Quicksand:https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"

[theme.dark]
primaryColor = "#E8748F"
backgroundColor = "#221A29"
secondaryBackgroundColor = "#2C2334"
textColor = "#F3EAEF"
borderColor = "#3D2F45"
baseRadius = "1.25rem"
buttonRadius = "full"
showWidgetBorder = true
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFont = "Quicksand:https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
