[server]
# Disabled: Streamlit's file watcher imports every installed package (including
# torch-dependent ones like transformers) to build its hot-reload path list.
# On this machine, torch's c10.dll fails to load outside the ctypes preload
# hotfix in src/ui/app.py, so the watcher's own imports crash with
# "OSError: [WinError 1114]" noise in the terminal on every file change poll.
# This doesn't break the app - Streamlit just logs the failure and moves on -
# but it's spammy. Disabling means edits to src/ui/app.py won't auto-reload;
# press 'r' in the browser tab or restart `streamlit run` to pick up changes.
fileWatcherType = "none"

# Defining both [theme.light] and [theme.dark] makes Streamlit show its own
# light/dark toggle in the app's settings menu (top-right "⋮" icon) - no
# custom CSS or session_state toggle code needed.
#
# Palette built from two user-specified colors: #003049 (deep navy - used as
# ink/headings in light mode, and as the page ground in dark mode) and
# #ffb3c6 (soft pink - the primary accent in both modes). Surfaces/borders
# are derived neutrals so the two anchor colors have room to read as accents
# rather than competing with a flat background.
# baseRadius/buttonRadius give soft, pill-shaped buttons and rounded cards
# natively (no custom CSS). Nunito (body) + Quicksand (headings) via
# Streamlit's native font/headingFont keys, which accept a Google Fonts CSS
# URL directly - no unsafe_allow_html needed for typography either.
[theme.light]
primaryColor = "#FFB3C6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF3F6"
textColor = "#003049"
borderColor = "#FFD9E3"
baseRadius = "1.25rem"
buttonRadius = "full"
showWidgetBorder = true
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFont = "Quicksand:https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"

[theme.dark]
primaryColor = "#FFB3C6"
backgroundColor = "#003049"
secondaryBackgroundColor = "#0A3F5C"
textColor = "#F5F7FA"
borderColor = "#154A66"
baseRadius = "1.25rem"
buttonRadius = "full"
showWidgetBorder = true
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
headingFont = "Quicksand:https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
