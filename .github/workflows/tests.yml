name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # sentence-transformers' embedding model is cached by hash across runs,
      # so a warm cache skips the download entirely on subsequent CI runs.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -e .[dev]

      # No API keys required: RapidAPI calls are mocked (unittest.mock.patch
      # on requests.get) and the Gemini client is mocked at the module level -
      # see tests/conftest.py and each test file's own docstring.
      - name: Run test suite
        run: pytest tests/ -v
