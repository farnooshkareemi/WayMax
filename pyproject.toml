[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waymax"
version = "0.1.0"
description = "Multi-agent travel optimizer built on LangGraph: sources live flight and hotel data and computes the cheapest combination that fits a budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=1.4.7",
    "langchain-google-genai>=4.2.6",
    "langgraph>=1.2.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.38",
    "streamlit-star-rating>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
