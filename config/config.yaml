# WayMax configuration
# Non-secret, reproducible tunables only. API keys (GOOGLE_API_KEY, Sky_Scanner_Key)
# stay in .env — never put secrets in this file.

llm:
  model: "gemini-2.5-flash"

sourcing:
  flights:
    host: "skyscanner-flights4.p.rapidapi.com"
    url: "https://skyscanner-flights4.p.rapidapi.com/api/v1/search"
    roundtrip_url: "https://skyscanner-flights4.p.rapidapi.com/api/v1/roundtrip"
    timeout_seconds: 30
    result_limit: 5
    currency: "EUR"
    cabin_class: "economy"
    market: "IT"
    locale: "en-US"
    request_limit: 20          # "limit" query param sent to the API
    default_max_flight_hours: 30

  hotels:
    host: "booking-data.p.rapidapi.com"
    autocomplete_url: "https://booking-data.p.rapidapi.com/booking/autocomplete"
    search_url: "https://booking-data.p.rapidapi.com/booking-app/search/by-dest"
    autocomplete_timeout_seconds: 15
    search_timeout_seconds: 30
    result_limit: 5
    units: "metric"
    temperature_unit: "c"
    room_qty: 1
    currency: "EUR"
    language_code: "en-us"

optimizer:
  rooms_per_traveler_divisor: 2   # ceil(travelers / this) = rooms needed
  default_nights_fallback: 1

rag:
  embedding_model: "all-MiniLM-L6-v2"
  persist_directory: "src/rag/.chroma"
  collection_name: "baggage_fees"
  top_k: 1   # number of matching documents to retrieve per airline query

ui:
  page_title: "WayMax"
  page_icon: "✈️"
  layout: "centered"
  currencies:
    - "€ EUR"
    - "$ USD"
    - "£ GBP"
    - "¥ JPY"
    - "C$ CAD"
    - "A$ AUD"
    - "CHF CHF"
    - "¥ CNY"
    - "₹ INR"
    - "R$ BRL"
    - "د.إ AED"
  budget:
    min: 100
    max: 20000
    default: 1000
    step: 50
  travelers:
    min: 1
    max: 10
    default: 1
    step: 1
  min_hotel_stars_default: 3
  max_flight_hours:
    min: 1
    max: 30
    default: 10

